name: ci
on:
  push:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust port tests
        run: cargo test
      - name: Rust port format check
        run: cargo fmt --check
      - name: Rust port clippy
        run: cargo clippy --all-targets -- -D warnings
