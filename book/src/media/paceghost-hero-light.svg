<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 492" width="920" height="492" role="img"><title>paceghost - window split pacing, ghost comparison, and linear usage boards</title><style>.sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }@keyframes pulseGlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }.live-dot { animation: pulseGlow 2.8s ease-in-out infinite; }@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }</style><rect x="1" y="1" width="918" height="490" rx="14" fill="#faf8f4" stroke="#dcd5c7" stroke-width="1.5"/>
        <text x="36" y="44" class="sans" font-size="13" font-weight="700" fill="#575249" letter-spacing="0.8">WINDOW SPLIT PACING &amp; LINEAR BURN-RATE BOARD</text>
        <circle cx="880" cy="39" r="5" fill="#047857" class="live-dot"/>
        <text x="866" y="44" text-anchor="end" class="mono" font-size="11" fill="#047857">THE BOARD CALLED IT</text>

        <rect x="36" y="60" width="424" height="172" rx="8" fill="#ffffff" stroke="#dcd5c7"/>
        <text x="54" y="84" class="sans" font-size="13" font-weight="700" fill="#151411">Live Pace Board · usage * window / elapsed</text>
        <text x="54" y="110" class="mono" font-size="11.5" fill="#b91c1c">t=300s   usage 210  -&gt; proj 1260   PAST BUDGET</text>
        <text x="54" y="134" class="mono" font-size="11.5" fill="#047857">t=700s   usage 430  -&gt; proj 1105.7 INSIDE GHOST</text>
        <text x="54" y="158" class="mono" font-size="11.5" fill="#047857">t=1200s  usage 760  -&gt; proj 1140   INSIDE GHOST</text>
        <line x1="54" y1="174" x2="442" y2="174" stroke="#dcd5c7"/>
        <text x="54" y="196" class="mono" font-size="11.5" font-weight="700" fill="#047857">Finish · actual 1090 vs last projection 1140</text>
        <text x="54" y="215" class="sans" font-size="11.5" fill="#575249">Exact Ratio&lt;BigInt&gt; projections with zero float drift</text>

        <rect x="478" y="60" width="406" height="172" rx="8" fill="#ffffff" stroke="#dcd5c7"/>
        <text x="496" y="84" class="sans" font-size="13" font-weight="700" fill="#151411">Ghost Split Race · live vs 1500s ghost</text>
        <text x="496" y="112" class="mono" font-size="11.5" fill="#151411">plan     240s  |  ahead by  60s</text>
        <rect x="720" y="101" width="144" height="12" rx="6" fill="#d1fae5"/><rect x="720" y="101" width="60" height="12" rx="6" fill="#047857"/>
        <text x="496" y="140" class="mono" font-size="11.5" fill="#151411">draft    780s  |  ahead by 120s</text>
        <rect x="720" y="129" width="144" height="12" rx="6" fill="#d1fae5"/><rect x="720" y="129" width="102" height="12" rx="6" fill="#047857"/>
        <text x="496" y="168" class="mono" font-size="11.5" fill="#151411">polish  1320s  |  ahead by 180s</text>
        <rect x="720" y="157" width="144" height="12" rx="6" fill="#d1fae5"/><rect x="720" y="157" width="132" height="12" rx="6" fill="#c25e00"/>
        <text x="496" y="204" class="mono" font-size="11.5" fill="#c25e00">480s spare inside 1800s window · ahead by 180s</text>
        <rect x="36" y="252" width="848" height="212" rx="10" fill="#181613" stroke="#dcd5c7"/><circle cx="56" cy="272" r="5" fill="#ef4444"/><circle cx="72" cy="272" r="5" fill="#f59e0b"/><circle cx="88" cy="272" r="5" fill="#10b981"/><text x="460" y="276" text-anchor="middle" class="mono" font-size="11" fill="#9c9588">paceghost - verified offline examples</text><line x1="36" y1="288" x2="884" y2="288" stroke="#2a2722"/><text x="54" y="310" class="mono" font-size="11.5" fill="#f59e0b">$ paceghost board examples/board-run.json examples/ghost-run.json</text><text x="54" y="329" class="mono" font-size="11.5" fill="#9c9588">read 0 at 0 seconds, usage 0, projects no figure</text><text x="54" y="348" class="mono" font-size="11.5" fill="#f87171">read 1 at 300 seconds, usage 210, projection 1260, past the ghost usage, past the budget</text><text x="54" y="367" class="mono" font-size="11.5" fill="#34d399">read 2 at 700 seconds, usage 430, projection 1105.714286, inside the ghost usage, inside the budget</text><text x="54" y="386" class="mono" font-size="11.5" fill="#34d399">read 3 at 1200 seconds, usage 760, projection 1140, inside the ghost usage, inside the budget</text><text x="54" y="405" class="mono" font-size="11.5" fill="#34d399">finish, actual usage 1090 against a last projection of 1140, inside the ghost usage, inside the budget, the board called it</text><text x="54" y="424" class="mono" font-size="11.5" fill="#f59e0b">$ paceghost reign examples/meet.json</text><text x="54" y="443" class="mono" font-size="11.5" fill="#f2eee6">reign counts, marks walked 16, spells 5, holders 3, longest spell 7 marks held by dawn fork</text></svg>
