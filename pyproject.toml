[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paceghost"
version = "0.1.0"
description = "The usage window as a game clock, raced against the ghost of your best run"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
paceghost = "paceghost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
