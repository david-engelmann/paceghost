[package]
name = "paceghost"
version = "0.1.0"
edition = "2021"
description = "Paceghost is a command line tool that reads recorded task runs and field days from local files and prints reports over them."

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "paceghost"
path = "rust/src/main.rs"

[[bin]]
name = "codepoint_scan"
path = "rust/src/bin/codepoint_scan.rs"

# The integration tests live beside the library under rust/tests, so
# each one is named here with its path rather than discovered from a
# root level tests directory.
